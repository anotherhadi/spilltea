pre-commit:
  piped: true
  commands:
    inject-exec-basics:
      glob: "{docs/basics.md,cmd/**}"
      run: python3 .github/scripts/inject-exec.py docs/basics.md
      stage_fixed: true
    inject-exec:
      glob: "{README.md,docs/basics.md,cmd/**}"
      run: python3 .github/scripts/inject-exec.py README.md
      stage_fixed: true
    toc:
      glob: "{README.md,docs/basics.md,cmd/**}"
      run: doctoc --notitle README.md
      stage_fixed: true
