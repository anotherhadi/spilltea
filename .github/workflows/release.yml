name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # the GitHub release
  id-token: write # build attestations
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the changelog needs the history
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the version of the built CLI
        run: test "$(./dist/spilltea_linux_amd64_v1/spilltea --version)" = "spilltea ${GITHUB_REF_NAME#v}"
      - uses: actions/attest-build-provenance@v3
        with:
          subject-checksums: ./dist/SHA256SUMS
