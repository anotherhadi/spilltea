name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: Smoke test the CLI
        run: |
          go build -o spilltea ./cmd/spilltea
          ./spilltea --version
          ./spilltea --help > /dev/null
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
