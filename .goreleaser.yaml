version: 2

builds:
  - id: spilltea
    main: ./cmd/spilltea
    binary: spilltea
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, freebsd]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/anotherhadi/spilltea/internal/config.Version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "spilltea_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: SHA256SUMS

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  draft: false
  prerelease: auto
